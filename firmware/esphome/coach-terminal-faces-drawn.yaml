# coach-terminal-faces-drawn.yaml — A/B build "Style A: procedural face".
#
# Includes the shared base (hardware + UI state machine) and adds a display that
# DRAWS the face with geometry primitives (eye rings + pupils, line mouths),
# animated via millis() (blink, mouth flap, thinking dots). No image assets.
#
# Flash:  sg uucp -c 'PYTHONUNBUFFERED=1 esphome run coach-terminal-faces-drawn.yaml --device /dev/ttyACM0'
# The face renders for ui_state 1-4; boot (0) and error (5) fall back to text.

packages:
  base: !include coach-terminal-base.yaml

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 150ms   # fast enough for blink / mouth-flap animation
    lambda: |-
      const int LX = 40, LY = 28, RX = 88, RY = 28, ER = 13, MX = 64, MY = 50;
      const uint32_t t = millis();

      // --- local drawing helpers ---
      auto ring = [&](int cx, int cy, int r) { it.circle(cx, cy, r); it.circle(cx, cy, r - 1); };
      auto pupil = [&](int cx, int cy, int dx, int dy) { it.filled_circle(cx + dx, cy + dy, 4); };
      auto lids = [&](int cx, int cy, int r) { for (int k = -1; k <= 1; k++) it.line(cx - r, cy + k, cx + r, cy + k); };
      auto seg = [&](int x1, int y1, int x2, int y2) { it.line(x1, y1, x2, y2); it.line(x1, y1 + 1, x2, y2 + 1); };

      switch (id(ui_state)) {
        case 1: {  // idle / ready
          bool blink = (t % 4000) < 150;
          if (blink) { lids(LX, LY, ER); lids(RX, RY, ER); }
          else {
            ring(LX, LY, ER); pupil(LX, LY, 0, 1);
            ring(RX, RY, ER); pupil(RX, RY, 0, 1);
          }
          seg(54, 49, 58, 52); seg(58, 52, 64, 53); seg(64, 53, 70, 52); seg(70, 52, 74, 49);  // smile
          break;
        }
        case 2: {  // listening
          seg(LX - ER, LY - ER - 4, LX + ER, LY - ER - 6);  // raised brows
          seg(RX - ER, RY - ER - 4, RX + ER, RY - ER - 6);
          ring(LX, LY, ER + 1); pupil(LX, LY, 0, 0);
          ring(RX, RY, ER + 1); pupil(RX, RY, 0, 0);
          it.circle(MX, MY, 4);                              // small "o" mouth
          break;
        }
        case 3: {  // thinking (LLM running)
          ring(LX, LY, ER); pupil(LX, LY, 3, -5);            // look up
          ring(RX, RY, ER); pupil(RX, RY, 3, -5);
          seg(56, 52, 72, 52);                               // flat mouth
          int nd = (t / 400) % 3 + 1;                         // "..." cycling 1-3
          for (int i = 0; i < nd; i++) it.filled_circle(100 + i * 9, 11, 2);
          break;
        }
        case 4: {  // talking (TTS playback)
          ring(LX, LY, ER); pupil(LX, LY, 0, 0);
          ring(RX, RY, ER); pupil(RX, RY, 0, 0);
          if ((t / 250) % 2 == 0) it.filled_circle(MX, MY, 6);   // mouth open
          else seg(MX - 7, MY, MX + 7, MY);                       // mouth closed
          break;
        }
        default: {  // 0 boot, 5 error -> diagnostic text screen
          it.print(0, 0, id(font_big), "Coach FR");
          it.printf(0, 26, id(font_small), "%s", id(coach_state).c_str());
          it.printf(0, 48, id(font_small), "up: %.0f s", id(uptime_s).state);
          break;
        }
      }
