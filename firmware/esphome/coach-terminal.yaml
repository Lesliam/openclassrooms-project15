# coach-terminal.yaml — ESPHome config SKELETON for the Coach FR voice terminal
#
# Target: ESP32-S3 N16R8 devkit (16 MB flash / 8 MB octal PSRAM)
# Audio out: MAX98357 I2S amplifier + 4-ohm 3W speaker
# Audio in:  INMP441 I2S MEMS microphone (confirmed 2026-07-06, CS-147)
#            Wiring: VDD->3V3, GND->GND, L/R->GND (left channel), WS/SCK/SD below
# Screen:    SSD1306 128x64 OLED, I2C SDA=41/SCL=42 @ 0x3C (confirmed 2026-07-16)
#
# STATUS: all four subsystems validated individually on the HW-678A board via
# the bring-up test configs (2026-07-16): board+PSRAM, INMP441 mic + KWS,
# SSD1306 OLED, MAX98357 amp. Audio pins confirmed against the vendor manual
# (2026-07-15): I2S mic WS=4/SCK=5/SD=6, I2S amp DIN=7/BCLK=15/LRC=16, RGB
# GPIO48. This production config folds those four into the voice_assistant
# pipeline. Before flashing: populate secrets.yaml (cp from the .example).
# Amp idle-hiss mitigation (SD-pin gating on GPIO2) is an OPTIONAL block at
# the bottom — it requires physically rewiring MAX98357 SD -> GPIO2 first.
#
# References:
#   https://esphome.io/components/esp32/
#   https://esphome.io/components/psram/
#   https://esphome.io/components/voice_assistant/
#   https://esphome.io/components/micro_wake_word/
#
# NOTE on pin choices: octal PSRAM on the S3 claims GPIO35/36/37 — never
# assign those to peripherals. All example pins below avoid them but are
# placeholders until wiring is fixed.

substitutions:
  name: coach-terminal
  friendly_name: Coach Terminal

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# N16R8 = 8 MB octal PSRAM. Required for micro_wake_word model + audio buffers.
psram:
  mode: octal
  speed: 80MHz

# Coach state string shown on the OLED, driven by the voice_assistant events.
globals:
  - id: coach_state
    type: std::string
    restore_value: false
    initial_value: '"Dites Okay Nabu"'

logger:
  # Serial logging can conflict with I2S DMA timing on some setups;
  # switch to logger over network only if audio glitches appear.
  level: DEBUG
  # On the ESP32-S3 (esp-idf) the default logger UART is the native USB-JTAG
  # peripheral; app logs then never reach the CH343 USB-UART adapter used for
  # flashing/monitoring. Pin the logger to UART0 so logs come out the CH343.
  # (Validated 2026-07-16 across every bring-up test config.)
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The target AP (Freebox) broadcasts a HIDDEN SSID. Scan-based association
  # fails ("No networks found") and the device thrashes between reconnect
  # phases. fast_connect skips the scan and associates directly to the
  # configured SSID; power_save_mode:none stops the modem-sleep beacon misses
  # that were causing 'Beacon Timeout' drops. (Fixes the 2026-07-16 wifi churn.)
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "Coach-Terminal Fallback"
    password: !secret fallback_ap_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# I2C bus for the SSD1306 OLED (confirmed 2026-07-16: SDA=41, SCL=42, addr 0x3C).
i2c:
  sda: GPIO41
  scl: GPIO42
  frequency: 400kHz

# Two independent I2S buses: the S3 has two I2S peripherals, so the mic
# (RX) and the MAX98357 (TX) each get their own bus.
i2s_audio:
  - id: i2s_bus_mic
    i2s_lrclk_pin: GPIO4   # INMP441 WS  (proposed free pin; adjust at wiring)
    i2s_bclk_pin: GPIO5    # INMP441 SCK (proposed free pin; adjust at wiring)
  - id: i2s_bus_amp
    i2s_lrclk_pin: GPIO16  # MAX98357 LRC — HW-678A vendor-recommended audio pin (confirmed 2026-07-15)
    i2s_bclk_pin: GPIO15   # MAX98357 BCLK — HW-678A vendor-recommended audio pin

microphone:
  - platform: i2s_audio
    id: terminal_mic
    i2s_audio_id: i2s_bus_mic
    i2s_din_pin: GPIO6     # INMP441 SD (proposed free pin; adjust at wiring)
    adc_type: external     # INMP441 = I2S MEMS mic, confirmed
    pdm: false             # INMP441 is standard I2S, not PDM
    channel: left          # requires L/R pin tied to GND on the module
    sample_rate: 16000
    bits_per_sample: 32bit # INMP441: 24-bit data in 32-bit I2S frame

speaker:
  - platform: i2s_audio
    id: terminal_speaker
    i2s_audio_id: i2s_bus_amp
    i2s_dout_pin: GPIO7    # MAX98357 DIN — HW-678A vendor-recommended audio pin
    dac_type: external
    sample_rate: 16000
    channel: mono          # MAX98357 is a mono amplifier

# On-device wake word (KWS). Placeholder model for bring-up; the custom
# French wake word trained in the KWS lifecycle work (dev-kws) replaces it.
micro_wake_word:
  id: kws
  microphone: terminal_mic
  models:
    # Bring-up model: stock, proven-good. Proves the wake -> pipeline path.
    - model: okay_nabu
    # NEXT: swap in the custom "hello lingorm" model (CS-152, ml/kws/models/).
    # ESPHome rejects a LOCAL manifest whose "model" is a bare filename
    # ("Expected a file scheme or a URL scheme with host"); the tflite ref must
    # be a file:// or http(s):// scheme. Options: (a) serve the manifest+tflite
    # over a local http URL, or (b) reference the tflite via a file:// URL in a
    # build-local manifest copy (keep the committed manifest scheme-clean).
  on_wake_word_detected:
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone: terminal_mic
  speaker: terminal_speaker
  # Wake word runs on-device via micro_wake_word, not in the HA pipeline:
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  # micro_wake_word must be explicitly started; it does not auto-run. Tie it to
  # the HA client connection so the wake word only listens when a pipeline is
  # available (a wake with no client would just error), and resume it after
  # each interaction (on_end/on_error) so it keeps listening.
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
  on_listening:
    - lambda: 'id(coach_state) = "Ecoute...";'
    - light.turn_on:
        id: status_led
        red: 0%
        green: 0%
        blue: 100%
  on_tts_start:
    - lambda: 'id(coach_state) = "Coach parle";'
    - output.turn_on: amp_sd      # power the MAX98357 only while speaking
    - light.turn_on:
        id: status_led
        red: 0%
        green: 100%
        blue: 0%
  on_end:
    - lambda: 'id(coach_state) = "Dites Okay Nabu";'
    - output.turn_off: amp_sd     # shut the amp down at idle (no hiss)
    - light.turn_off: status_led
    - micro_wake_word.start:      # resume listening for the next wake word
  on_error:
    - lambda: 'id(coach_state) = "Erreur";'
    - output.turn_off: amp_sd
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
    - micro_wake_word.start:      # keep listening even after an error

# Status LED placeholder — many S3 devkits have an onboard WS2812 on GPIO48
# (some board revisions use GPIO38). TODO: confirm on the actual board.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO48            # onboard WS2812 — confirmed GPIO48 (HW-678A manual + factory demo)
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812
    default_transition_length: 0s

# Screen: SSD1306 128x64 monochrome OLED, I2C @ 0x3C (confirmed 2026-07-16).
font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 20
  - file: "gfonts://Roboto"
    id: font_small
    size: 12

sensor:
  - platform: uptime
    id: uptime_s
    update_interval: 1s

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      it.print(0, 0, id(font_big), "Coach FR");
      it.printf(0, 26, id(font_small), "%s", id(coach_state).c_str());
      it.printf(0, 54, id(font_small), "up: %.0f s", id(uptime_s).state);

switch:
  - platform: template
    name: "Mute"
    id: mute_switch
    optimistic: true
    # TODO: wire to micro_wake_word stop/start so mute actually disables KWS

# --- amp idle-hiss mitigation via SD-pin gating (ENABLED) -------------------
# MAX98357 SD is rewired to GPIO2 (confirmed 2026-07-16). The output defaults
# OFF, so the amp is shut down at idle (no hiss); voice_assistant powers it up
# on_tts_start and shuts it down on_end/on_error. If the first TTS is silent,
# the SD-pin channel-select voltage may differ from the breakout default —
# fall back to holding amp_sd ON (add `- output.turn_on: amp_sd` under on_boot)
# and re-check audio.
output:
  - platform: gpio
    id: amp_sd
    pin: GPIO2
    # default state is OFF (amp shut down) -> only powered during TTS
